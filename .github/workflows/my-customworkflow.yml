name: Custom Workflow

on:
  push:
    branches: [working-intermediate-chathura]
  workflow_dispatch:

jobs:
  custom-job:
    runs-on: ubuntu-latest
    
    # Task 7: Matrix strategy to test on multiple Node versions
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    # Task 5: Job level environment variables
    env:
      NODE_ENV: test
      LOG_LEVEL: debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Task 7: Setup Node.js based on matrix version
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.matrix.node-version }}

      # Task 5: Print environment variables
      - name: Print environment
        run: |
          echo "Environment: ${{ env.NODE_ENV }}"
          echo "Log Level: ${{ env.LOG_LEVEL }}"     

      # Task 4: Run install and test in the sample-app directory
      - name: Install and Test
        run: |
          cd sample-app
          npm install
          npm test

      # Task 6: Access secret securely using an env variable to avoid Bash errors
      - name: Access secret
        run: echo "Secret length is ${#SECRET_VALUE}"
        env:
          SECRET_VALUE: ${{ secrets.TEST_SECRET }}
