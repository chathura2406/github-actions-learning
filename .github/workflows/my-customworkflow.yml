name: Custom Workflow
on:
  push:
    branches: [working-intermediate-chathura]

jobs:
  custom-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
        env:
            NODE_ENV: test
            LOG_LEVEL: debug
            
            steps:
              - name: Checkout code
                uses: actions/checkout@v3

              - name: Print environment
                run: |
                  echo "Environment: ${{ env.NODE_ENV }}"
                  echo "Log Level: ${{ env.LOG_LEVEL }}"