name: Build and Test

on:
  push:
    branches: [main, develop, working-advanced-chathura]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install

      - name: Build application
        working-directory: ./sample-app
        run: npm run build

      - name: Create artifact
        run: echo "Build output for Chathura - Task 8 Success" > output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.node-version }}
          path: output.txt

      - name: Run tests
        working-directory: ./sample-app
        run: npm test

      - name: Upload coverage reports
        if: matrix.node-version == '18.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: sample-app/coverage/
          retention-days: 30

  download-artifact-job:
    name: Download and Verify Artifact
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-18.x

      - name: Read artifact
        run: |
          echo "Reading data from the previous job:"
          cat output.txt

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install

      - name: Run ESLint
        working-directory: ./sample-app
        run: npm run lint
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint-check, download-artifact-job]
    if: always()
    steps:
      - name: Print results
        run: |
          echo "Build-and-test result: ${{ needs.build-and-test.result }}"
          echo "Lint-check result: ${{ needs.lint-check.result }}"
          echo "Download-artifact-job result: ${{ needs.download-artifact-job.result }}"
